apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: test-environment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
      - name: checkout-api
        image: mock-registry.internal/checkout-api:v1.0.0
        ports:
        - containerPort: 8080